# Landing page → GitHub Pages. Static docs/, no build step. numbers.json is regenerated from
# the checked-out tree right before upload (scripts/site-numbers.mjs), so the live page can
# never show a stale tool/test/LOC count — the committed copy is pinned separately by the tests.
name: pages
on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/**', 'test/**', 'README.md', 'package.json', 'scripts/site-numbers.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: numbers.json from the tree
        run: node scripts/site-numbers.mjs > /dev/null && cat docs/numbers.json | head -20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
